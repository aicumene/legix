lints.workspace = true

[package]
name = "legix-glob"
version = "0.28.0"
repository = "https://github.com/aicumene/legix"
license = "MIT OR Apache-2.0"
description = "A crate of legix, a fork of the gitoxide project dealing with pattern matching"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
rust-version = "1.88"
include = ["/src/**/*", "/LICENSE-*"]

[lib]
doctest = true

[[bench]]
name = "wildmatch"
harness = false
path = "./benches/wildmatch.rs"

[features]
## Data structures implement `serde::Serialize` and `serde::Deserialize`.
serde = ["dep:serde", "bstr/serde", "bitflags/serde"]

[dependencies]
legix-utils = { version = "^0.4.0", path = "../legix-utils" }
legix-path = { version = "^0.13.0", path = "../legix-path" }
legix-features = { version = "^0.50.0", path = "../legix-features" }
bstr = { version = "1.12.0", default-features = false, features = ["std"] }
bitflags = "2"
serde = { version = "1.0.114", optional = true, default-features = false, features = ["derive"] }

document-features = { version = "0.2.0", optional = true }

[dev-dependencies]
criterion = "0.8.2"
legix-testtools = { path = "../tests/tools", features = ["sha1"] }

[package.metadata.docs.rs]
all-features = true
features = ["document-features"]
