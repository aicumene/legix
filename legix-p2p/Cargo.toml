lints.workspace = true

[package]
name = "legix-p2p"
version = "0.1.0"
description = "Device-to-device sync for leGix over iroh: on the local network and through NAT, between members only"
repository = "https://github.com/aicumene/legix"
license = "MIT OR Apache-2.0"
authors = ["Ivan Menshikov <menshivan@gmail.com>"]
edition = "2024"
rust-version = "1.88"
keywords = ["git", "p2p", "iroh", "sync", "legix"]
categories = ["network-programming", "development-tools"]
include = ["src/**/*", "README.md", "FORMAT.md", "LICENSE-*"]

[dependencies]
legix-sync = { version = "^0.1.0", path = "../legix-sync" }
legix-members = { version = "^0.1.0", path = "../legix-members" }
legix-crypt = { version = "^0.1.0", path = "../legix-crypt" }
legix-sign = { version = "^0.1.0", path = "../legix-sign", default-features = false }

ed25519-dalek = { version = "2.2.0", default-features = false }
iroh = { version = "1.3.0", default-features = false, features = ["tls-ring"], optional = true }
tempfile = "3.26.0"
thiserror = "2.0.18"
tokio = { version = "1", features = ["macros"], optional = true }

[features]
default = ["iroh"]
## Sync with other devices over iroh (`Peer`). Without it, the crate syncs relays on one machine (`replicate`).
iroh = ["dep:iroh", "dep:tokio"]

[[test]]
name = "p2p"
required-features = ["iroh"]

[dev-dependencies]
legix = { version = "^0.88.0", path = "../legix", features = ["sha256"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
