lints.workspace = true

[package]
name = "legix-validate"
version = "0.12.0"
repository = "https://github.com/aicumene/legix"
license = "MIT OR Apache-2.0"
description = "Validation functions for various kinds of names in git"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
include = ["/src/**/*", "/LICENSE-*"]
rust-version = "1.88"

[lib]
doctest = true
test = true

[dependencies]
legix-error = { version = "^0.4.0", path = "../legix-error" }

bstr = { version = "1.12.0", default-features = false, features = ["std"] }

[dev-dependencies]
insta = "1.46.3"
legix-testtools = { path = "../tests/tools", default-features = false, features = ["sha1"] }
