[package]
name = "gix-merge-fuzz"
version = "0.0.0"
authors = ["Automatically generated"]
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
anyhow = "1.0.76"
libfuzzer-sys = "0.4"
arbitrary = { version = "1.3.2", features = ["derive"] }
imara-diff = { package = "legix-imara-diff", version = "0.2.0", path = "../../legix-imara-diff" }
legix-diff = { path = "../../legix-diff" }
legix-error = { path = "../../legix-error" }
legix-filter = { path = "../../legix-filter" }
legix-hash = { path = "../../legix-hash", features = ["sha1"] }
legix-merge = { path = "..", features = ["sha1"] }
legix-object = { path = "../../legix-object" }
legix-odb = { path = "../../legix-odb" }
legix-worktree = { path = "../../legix-worktree" }

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[[bin]]
name = "blob"
path = "fuzz_targets/blob.rs"
test = false
doc = false

[[bin]]
name = "tree"
path = "fuzz_targets/tree.rs"
test = false
doc = false
