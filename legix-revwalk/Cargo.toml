lints.workspace = true

[package]
name = "legix-revwalk"
version = "0.36.0"
repository = "https://github.com/aicumene/legix"
license = "MIT OR Apache-2.0"
description = "A crate providing utilities for walking the revision graph"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
include = ["/src/**/*", "/LICENSE-*"]
rust-version = "1.88"

[lib]
doctest = false

[features]
## Enable support for the SHA-1 hash by forwarding the feature to dependencies.
sha1 = ["legix-hash/sha1"]
## Enable support for the SHA-256 hash by forwarding the feature to dependencies.
sha256 = ["legix-hash/sha256"]

[dependencies]
legix-hash = { version = "^0.27.0", path = "../legix-hash" }
legix-error = { version = "^0.4.0", path = "../legix-error" }
legix-object = { version = "^0.65.0", path = "../legix-object" }
legix-date = { version = "^0.17.0", path = "../legix-date" }
legix-hashtable = { version = "^0.17.0", path = "../legix-hashtable" }
legix-commitgraph = { version = "^0.40.0", path = "../legix-commitgraph" }

smallvec = "1.15.1"

[dev-dependencies]
legix-testtools = { path = "../tests/tools", default-features = false }
legix-hash = { path = "../legix-hash", features = ["sha1", "sha256"] }

[package.metadata.docs.rs]
features = ["sha1"]
