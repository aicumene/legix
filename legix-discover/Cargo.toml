lints.workspace = true

[package]
name = "legix-discover"
version = "0.56.0"
repository = "https://github.com/aicumene/legix"
license = "MIT OR Apache-2.0"
description = "Discover git repositories and check if a directory is a git repository"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
include = ["/src/**/*", "/LICENSE-*"]
rust-version = "1.88"

[lib]
doctest = true

[features]
## Enable support for the SHA-1 hash by forwarding the feature to dependencies.
sha1 = ["legix-ref/sha1"]
## Enable support for the SHA-256 hash by forwarding the feature to dependencies.
sha256 = ["legix-ref/sha256"]

[dependencies]
legix-sec = { version = "^0.15.0", path = "../legix-sec" }
legix-path = { version = "^0.13.0", path = "../legix-path" }
legix-ref = { version = "^0.68.0", path = "../legix-ref" }
legix-fs = { version = "^0.23.0", path = "../legix-fs" }
legix-error = { version = "^0.4.0", path = "../legix-error" }

bstr = { version = "1.12.0", default-features = false, features = ["std", "unicode"] }

[target.'cfg(windows)'.dependencies]
dunce = "1.0.3"

[dev-dependencies]
insta = "1.46.3"
legix-testtools = { path = "../tests/tools", features = ["sha1"] }
serial_test = { version = "3.4.0", default-features = false }
is_ci = "1.1.1"

[target.'cfg(target_os = "macos")'.dev-dependencies]
defer = "0.2.1"

[target.'cfg(any(unix, windows))'.dev-dependencies]
tempfile = "3.26.0"

[package.metadata.docs.rs]
features = ["sha1"]
