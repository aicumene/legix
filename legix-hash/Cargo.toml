lints.workspace = true

[package]
name = "legix-hash"
version = "0.27.0"
description = "Borrowed and owned git hash digests used to identify git objects"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
repository = "https://github.com/aicumene/legix"
license = "MIT OR Apache-2.0"
edition = "2024"
include = ["/src/**/*", "/LICENSE-*"]
rust-version = "1.88"

[lib]
doctest = true
test = false

[features]
default = []
## Support for SHA1 hashes and digests.
sha1 = ["dep:sha1dc"]
## Support for SHA256 hashes and digests.
sha256 = ["dep:sha2"]
## Data structures implement `serde::Serialize` and `serde::Deserialize`.
serde = ["dep:serde", "faster-hex/serde"]
## Enable comparisons between [`ObjectId`](https://docs.rs/legix-hash/latest/legix_hash/enum.ObjectId.html) and `bstr` types.
bstr = ["dep:bstr"]

[dependencies]
legix-features = { version = "^0.50.0", path = "../legix-features", features = ["progress"] }
legix-error = { version = "^0.4.0", path = "../legix-error" }

bstr = { version = "1.12.0", optional = true, default-features = false, features = ["alloc"] }
faster-hex = { version = "0.10.1", default-features = false, features = ["std"] }
serde = { version = "1.0.114", optional = true, default-features = false, features = ["derive"] }
sha1dc = { version = "0.1.2", optional = true, default-features = false, features = ["std"] }
sha2 = { version = "0.11.0", optional = true, default-features = false }

document-features = { version = "0.2.0", optional = true }

[dev-dependencies]
insta = "1.46.3"
legix-hash = { path = ".", features = ["sha1", "sha256", "bstr"] }
legix-testtools = { path = "../tests/tools", default-features = false }

[package.metadata.docs.rs]
all-features = true
features = ["sha1", "document-features"]
