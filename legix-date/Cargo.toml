lints.workspace = true

[package]
name = "legix-date"
version = "0.17.0"
repository = "https://github.com/aicumene/legix"
license = "MIT OR Apache-2.0"
description = "A crate of legix, a fork of the gitoxide project parsing dates the way git does"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
include = ["/src/**/*", "/LICENSE-*"]
rust-version = "1.88"

[lib]
doctest = true

[features]
## Data structures implement `serde::Serialize` and `serde::Deserialize`.
serde = ["dep:serde", "bstr/serde"]

[dependencies]
legix-error = { version = "^0.4.0", path = "../legix-error" }
bstr = { version = "1.12.0", default-features = false, features = ["std"] }
serde = { version = "1.0.114", optional = true, default-features = false, features = ["derive"] }
itoa = "1.0.17"
jiff = "0.2.25"

document-features = { version = "0.2.0", optional = true }

[dev-dependencies]
insta = "1.46.3"
legix-hash = { path = "../legix-hash" }
legix-testtools = { path = "../tests/tools", default-features = false, features = ["sha1"] }
pretty_assertions = "1.4.1"

[package.metadata.docs.rs]
all-features = true
features = ["document-features"]
