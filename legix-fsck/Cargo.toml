lints.workspace = true

[package]
name = "legix-fsck"
version = "0.26.0"
repository = "https://github.com/aicumene/legix"
authors = ["Cameron Esfahani <cesfahani@gmail.com>", "Sebastian Thiel <sebastian.thiel@icloud.com>"]
license = "MIT OR Apache-2.0"
description = "Verifies the connectivity and validity of objects in the database"
edition = "2024"
include = ["/src/**/*", "/LICENSE-*"]
rust-version = "1.88"

[lib]
doctest = false

[features]
## Enable support for the SHA-1 hash by forwarding the feature to dependencies.
sha1 = ["legix-hash/sha1"]
## Enable support for the SHA-256 hash by forwarding the feature to dependencies.
sha256 = ["legix-hash/sha256"]

[dependencies]
legix-error = { version = "^0.4.0", path = "../legix-error" }
legix-hash = { version = "^0.27.0", path = "../legix-hash" }
legix-hashtable = { version = "^0.17.0", path = "../legix-hashtable" }
legix-object = { version = "^0.65.0", path = "../legix-object" }

[dev-dependencies]
legix-odb = { path = "../legix-odb", features = ["sha1", "sha256"] }
legix-testtools = { path = "../tests/tools" }

[package.metadata.docs.rs]
features = ["sha1"]
