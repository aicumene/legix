lints.workspace = true

[package]
name = "legix-bitmap"
version = "0.5.0"
repository = "https://github.com/aicumene/legix"
license = "MIT OR Apache-2.0"
description = "A crate of legix, a fork of the gitoxide project dedicated implementing the standard git bitmap format"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
rust-version = "1.88"
include = ["/src/**/*", "/LICENSE-*"]

[lib]
doctest = true
test = true

[dependencies]
legix-error = { version = "^0.4.0", path = "../legix-error" }

[dev-dependencies]
legix-testtools = { path = "../tests/tools", default-features = false }
