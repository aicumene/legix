lints.workspace = true

[package]
name = "legix-path"
version = "0.13.0"
repository = "https://github.com/aicumene/legix"
license = "MIT OR Apache-2.0"
description = "A crate of legix, a fork of the gitoxide project dealing paths and their conversions"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
include = ["/src/**/*", "/LICENSE-*"]
rust-version = "1.88"

[lib]
doctest = true

[dependencies]
legix-error = { version = "^0.4.0", path = "../legix-error" }
legix-trace = { version = "^0.2.0", path = "../legix-trace" }
legix-validate = { version = "^0.12.0", path = "../legix-validate" }
bstr = { version = "1.12.0", default-features = false, features = ["std"] }

[dev-dependencies]
legix-testtools = { path = "../tests/tools", default-features = false, features = ["sha1"] }
insta = "1.46.3"
serial_test = { version = "3.4.0", default-features = false }
tempfile = "3.26.0"

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62.1", features = [
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }
winreg = "0.56.0"
