lints.workspace = true

[package]
name = "legix-object"
version = "0.65.0"
description = "Immutable and mutable git objects with decoding and encoding support"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
repository = "https://github.com/aicumene/legix"
license = "MIT OR Apache-2.0"
edition = "2024"
include = ["/src/**/*", "/LICENSE-*"]
rust-version = "1.88"

[lib]
doctest = true

[[bench]]
name = "decode-objects"
harness = false
path = "./benches/decode_objects.rs"

[[bench]]
name = "edit-tree"
harness = false
path = "./benches/edit_tree.rs"


[features]
## Enable commit and annotated-tag signing and signature verification with external programs.
signature = ["dep:legix-command", "dep:legix-path", "dep:legix-tempfile"]
## Enable support for the SHA-1 hash by enabling the respective feature in the `legix-hash` crate.
sha1 = ["legix-hash/sha1"]
## Enable support for the SHA-256 hash by enabling the respective feature in the `legix-hash` crate.
sha256 = ["legix-hash/sha256"]
## Data structures implement `serde::Serialize` and `serde::Deserialize`.
serde = [
    "dep:serde",
    "bstr/serde",
    "smallvec/serde",
    "legix-hash/serde",
    "legix-actor/serde",
]
[dependencies]
legix-features = { version = "^0.50.0", path = "../legix-features", features = [
    "progress",
] }
legix-hash = { version = "^0.27.0", path = "../legix-hash" }
legix-hashtable = { version = "^0.17.0", path = "../legix-hashtable" }
legix-validate = { version = "^0.12.0", path = "../legix-validate" }
legix-actor = { version = "^0.43.0", path = "../legix-actor" }
legix-date = { version = "^0.17.0", path = "../legix-date" }
legix-utils = { version = "^0.4.0", path = "../legix-utils" }
legix-command = { version = "^0.11.0", path = "../legix-command", optional = true }
legix-path = { version = "^0.13.0", path = "../legix-path", optional = true }
legix-error = { version = "^0.4.0", path = "../legix-error" }
legix-tempfile = { version = "^25.0.0", path = "../legix-tempfile", optional = true }

itoa = "1.0.17"
bstr = { version = "1.12.0", default-features = false, features = [
    "std",
    "unicode",
] }
smallvec = { version = "1.15.1", features = ["write"] }
serde = { version = "1.0.114", optional = true, default-features = false, features = [
    "derive",
] }

document-features = { version = "0.2.0", optional = true }

[dev-dependencies]
legix-object = { path = ".", features = ["signature", "sha1", "sha256"] }
legix-hash = { path = "../legix-hash", features = ["bstr"] }
legix-testtools = { path = "../tests/tools", default-features = false }
legix-odb = { path = "../legix-odb" }
termtree = "1.0.0"
criterion = "0.8.2"
pretty_assertions = "1.0.0"
insta = "1.46.3"

[package.metadata.docs.rs]
all-features = true
features = ["sha1", "document-features"]
