lints.workspace = true

[package]
name = "legix-credentials"
version = "0.41.0"
repository = "https://github.com/aicumene/legix"
license = "MIT OR Apache-2.0"
description = "A crate of legix, a fork of the gitoxide project to interact with git credentials helpers"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
rust-version = "1.88"
include = ["/src/**/*", "/LICENSE-*"]

[lib]
doctest = false

[features]
## Data structures implement `serde::Serialize` and `serde::Deserialize`.
serde = ["dep:serde", "bstr/serde", "legix-sec/serde"]

[dependencies]
legix-sec = { version = "^0.15.0", path = "../legix-sec" }
legix-error = { version = "^0.4.0", path = "../legix-error" }
legix-url = { version = "^0.39.0", path = "../legix-url" }
legix-path = { version = "^0.13.0", path = "../legix-path" }
legix-quote = { version = "^0.9.0", path = "../legix-quote" }
legix-command = { version = "^0.11.0", path = "../legix-command" }
legix-config-value = { version = "^0.20.0", path = "../legix-config-value" }
legix-prompt = { version = "^0.18.0", path = "../legix-prompt" }
legix-date = { version = "^0.17.0", path = "../legix-date" }
legix-trace = { version = "^0.2.0", path = "../legix-trace" }

serde = { version = "1.0.114", optional = true, default-features = false, features = ["derive"] }
bstr = { version = "1.12.0", default-features = false, features = ["std"] }



document-features = { version = "0.2.1", optional = true }

[dev-dependencies]
insta = "1.46.3"
legix-sec = { path = "../legix-sec" }
legix-testtools = { path = "../tests/tools", features = ["sha1"] }

[package.metadata.docs.rs]
all-features = true
features = ["document-features"]

[package.metadata.cargo-machete]
ignored = [
    # Public optional `serde` feature is retained for downstream feature compatibility.
    "serde",
]
