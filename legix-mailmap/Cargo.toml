lints.workspace = true

[package]
name = "legix-mailmap"
version = "0.35.0"
repository = "https://github.com/aicumene/legix"
license = "MIT OR Apache-2.0"
description = "A crate of legix, a fork of the gitoxide project for parsing mailmap files"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
rust-version = "1.88"
include = ["/src/**/*", "/LICENSE-*"]

[lib]
doctest = true

[features]
## Data structures implement `serde::Serialize` and `serde::Deserialize`.
serde = ["dep:serde", "bstr/serde", "legix-actor/serde"]

[dependencies]
legix-actor = { version = "^0.43.0", path = "../legix-actor" }
legix-date = { version = "^0.17.0", path = "../legix-date" }
bstr = { version = "1.12.0", default-features = false, features = ["std", "unicode"] }
legix-error = { version = "^0.4.0", path = "../legix-error" }
serde = { version = "1.0.114", optional = true, default-features = false, features = ["derive"] }

document-features = { version = "0.2.0", optional = true }

[dev-dependencies]
legix-testtools = { path = "../tests/tools", features = ["sha1"] }
insta = "1.46.3"

[package.metadata.docs.rs]
all-features = true
features = ["document-features"]
