lints.workspace = true

[package]
name = "legix-folder"
version = "0.1.0"
description = "A folder of documents with a signed, encrypted, synced history: leGix for an application in one type"
repository = "https://github.com/aicumene/legix"
license = "MIT OR Apache-2.0"
authors = ["Ivan Menshikov <menshivan@gmail.com>"]
edition = "2024"
rust-version = "1.88"
keywords = ["git", "documents", "history", "encryption", "legix"]
categories = ["filesystem", "development-tools"]
include = ["src/**/*", "README.md", "LICENSE-*"]

[dependencies]
legix = { version = "^0.88.0", path = "../legix", features = ["sha256"] }
legix-crypt = { version = "^0.1.0", path = "../legix-crypt" }
legix-sign = { version = "^0.1.0", path = "../legix-sign" }
legix-sync = { version = "^0.1.0", path = "../legix-sync" }
legix-members = { version = "^0.1.0", path = "../legix-members" }
legix-p2p = { version = "^0.1.0", path = "../legix-p2p", default-features = false }
iroh = { version = "1.3.0", default-features = false, features = ["tls-ring"], optional = true }
tokio = { version = "1", features = ["time"], optional = true }

blake3 = "1.8.7"
ed25519-dalek = { version = "2.2.0", default-features = false }
tempfile = "3.26.0"
thiserror = "2.0.18"
zeroize = "1.9.0"

[features]
## Sync directly between devices over iroh: `Folder::peer`, `Folder::sync_direct`. Needs Rust 1.91, as iroh does.
p2p = ["legix-p2p/iroh", "dep:iroh", "dep:tokio"]

[[test]]
name = "direct"
required-features = ["p2p"]

[dev-dependencies]
legix-members = { version = "^0.1.0", path = "../legix-members" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
