lints.workspace = true

[package]
name = "legix-dir"
version = "0.30.0"
repository = "https://github.com/aicumene/legix"
license = "MIT OR Apache-2.0"
description = "A crate of legix, a fork of the gitoxide project dealing with directory walks"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
rust-version = "1.88"
include = ["/src/**/*", "/LICENSE-*"]

[lib]
doctest = false
test = false

[features]
## Enable support for the SHA-1 hash by forwarding the feature to dependencies.
sha1 = ["legix-index/sha1", "legix-worktree/sha1"]
## Enable support for the SHA-256 hash by forwarding the feature to dependencies.
sha256 = ["legix-index/sha256", "legix-worktree/sha256"]

[dependencies]
legix-error = { version = "^0.4.0", path = "../legix-error" }
legix-trace = { version = "^0.2.0", path = "../legix-trace" }
legix-index = { version = "^0.56.0", path = "../legix-index" }
legix-discover = { version = "^0.56.0", path = "../legix-discover" }
legix-fs = { version = "^0.23.0", path = "../legix-fs" }
legix-path = { version = "^0.13.0", path = "../legix-path" }
legix-pathspec = { version = "^0.21.0", path = "../legix-pathspec" }
legix-worktree = { version = "^0.57.0", path = "../legix-worktree", default-features = false }
legix-object = { version = "^0.65.0", path = "../legix-object" }
legix-ignore = { version = "^0.23.0", path = "../legix-ignore" }
legix-utils = { version = "^0.4.0", path = "../legix-utils", features = ["bstr"] }

bstr = { version = "1.12.0", default-features = false }

[dev-dependencies]
insta = "1.46.3"
legix-dir = { path = ".", features = ["sha1", "sha256"] }
legix-testtools = { path = "../tests/tools" }
legix-fs = { path = "../legix-fs" }
pretty_assertions = "1.4.0"

[package.metadata.docs.rs]
features = ["sha1"]
