lints.workspace = true

[package]
name = "legix-chunk"
version = "0.9.0"
description = "Interact with the git chunk file format used in multi-pack index and commit-graph files"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
repository = "https://github.com/aicumene/legix"
documentation = "https://github.com/git/git/blob/seen/Documentation/technical/chunk-format.txt"
license = "MIT OR Apache-2.0"
edition = "2024"
include = ["/src/**/*", "/LICENSE-*"]
rust-version = "1.88"

[lib]
doctest = true
test = false

[dependencies]
legix-error = { version = "^0.4.0", path = "../legix-error" }
