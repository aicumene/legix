lints.workspace = true

[package]
name = "legix-revision"
version = "0.50.0"
repository = "https://github.com/aicumene/legix"
license = "MIT OR Apache-2.0"
description = "A crate of legix, a fork of the gitoxide project dealing with finding names for revisions and parsing specifications"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
include = ["/src/**/*", "/LICENSE-*", "/README.md"]
rust-version = "1.88"

[lib]
doctest = false

[features]
default = ["describe", "merge_base"]
## Enable support for the SHA-1 hash by enabling the respective feature in the `legix-hash` crate.
sha1 = ["legix-hash/sha1"]
## Enable support for the SHA-256 hash by enabling the respective feature in the `legix-hash` crate.
sha256 = ["legix-hash/sha256"]

## `git describe` functionality
describe = ["dep:legix-trace", "dep:legix-hashtable"]

## `git merge-base` functionality
merge_base = ["dep:legix-trace", "dep:bitflags"]

## Data structures implement `serde::Serialize` and `serde::Deserialize`.
serde = ["dep:serde", "legix-hash/serde", "legix-object/serde"]

[dependencies]
legix-error = { version = "^0.4.0", path = "../legix-error" }
legix-hash = { version = "^0.27.0", path = "../legix-hash" }
legix-object = { version = "^0.65.0", path = "../legix-object" }
legix-date = { version = "^0.17.0", path = "../legix-date" }
legix-hashtable = { version = "^0.17.0", path = "../legix-hashtable", optional = true }
legix-revwalk = { version = "^0.36.0", path = "../legix-revwalk" }
legix-commitgraph = { version = "^0.40.0", path = "../legix-commitgraph" }
legix-trace = { version = "^0.2.0", path = "../legix-trace", optional = true }

bstr = { version = "1.12.0", default-features = false, features = ["std"] }
bitflags = { version = "2", optional = true }
nonempty = "0.12.0"
serde = { version = "1.0.114", optional = true, default-features = false, features = ["derive"] }
document-features = { version = "0.2.1", optional = true }

[dev-dependencies]
insta = "1.46.3"
legix-odb = { path = "../legix-odb", features = ["sha1", "sha256"] }
legix-testtools = { path = "../tests/tools" }
permutohedron = "0.2.4"

[package.metadata.docs.rs]
all-features = true
features = ["sha1", "document-features"]
