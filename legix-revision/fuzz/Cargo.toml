[package]
name = "gix-revision-fuzz"
version = "0.0.0"
authors = ["Automatically generated"]
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
legix-hash = { path = "../../legix-hash" }
legix-error = { path = "../../legix-error" }
bstr = { version = "1.5.0", default-features = false }

[dependencies.legix-revision]
path = ".."
features = ["sha1"]

# Prevent this from interfering with workspaces
[workspace]
members = ["."]


[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
