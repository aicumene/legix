lints.workspace = true

[package]
name = "legix-filter"
version = "0.35.0"
repository = "https://github.com/aicumene/legix"
license = "MIT OR Apache-2.0"
description = "A crate of legix, a fork of the gitoxide project implementing git filters"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
rust-version = "1.88"
include = [
    "/src/**/*",
    "/LICENSE-*",
    # Cargo packages declared examples and binaries, and the example includes the test helper.
    "/examples/arrow.rs",
    "/tests/helpers/arrow.rs",
]

[lib]
doctest = false

[[bin]]
name = "gix-filter-test-arrow"
path = "tests/helpers/arrow.rs"
# The self dev-dependency below enables this only while building tests.
required-features = ["test-helper"]
test = false
bench = false
doc = false

[features]
## Enable support for the SHA-1 hash by forwarding the feature to dependencies.
sha1 = ["legix-hash/sha1"]
## Enable support for the SHA-256 hash by forwarding the feature to dependencies.
sha256 = ["legix-hash/sha256"]
## Enable thread-safety, make data structures `Send`.
parallel = ["legix-attributes/parallel"]
## Internal feature for building binaries referenced by integration tests through CARGO_BIN_EXE_*.
test-helper = []

[dependencies]
legix-hash = { version = "^0.27.0", path = "../legix-hash" }
legix-trace = { version = "^0.2.0", path = "../legix-trace" }
legix-object = { version = "^0.65.0", path = "../legix-object" }
legix-command = { version = "^0.11.0", path = "../legix-command" }
legix-quote = { version = "^0.9.0", path = "../legix-quote" }
legix-utils = { version = "^0.4.0", path = "../legix-utils" }
legix-path = { version = "^0.13.0", path = "../legix-path" }
legix-packetline = { version = "^0.23.0", path = "../legix-packetline", features = ["blocking-io"] }
legix-attributes = { version = "^0.36.0", path = "../legix-attributes" }

encoding_rs = "0.8.32"
bstr = { version = "1.12.0", default-features = false, features = ["std"] }
legix-error = { version = "^0.4.0", path = "../legix-error" }
smallvec = "1.15.1"


[dev-dependencies]
insta = "1.46.3"
legix-filter = { path = ".", features = ["test-helper"] }
legix-hash = { path = "../legix-hash", features = ["sha1", "sha256"] }
legix-quote = { path = "../legix-quote" }
legix-testtools = { path = "../tests/tools" }
legix-worktree = { path = "../legix-worktree", default-features = false, features = ["attributes"] }

[package.metadata.docs.rs]
features = ["sha1"]
