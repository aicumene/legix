lints.workspace = true

[package]
name = "legix-quote"
version = "0.9.0"
repository = "https://github.com/aicumene/legix"
license = "MIT OR Apache-2.0"
description = "A crate of legix, a fork of the gitoxide project dealing with various quotations used by git"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
rust-version = "1.88"
include = ["/src/**/*", "/LICENSE-*"]

[lib]
doctest = true

[dependencies]
legix-utils = { version = "^0.4.0", path = "../legix-utils" }

bstr = { version = "1.12.0", default-features = false, features = ["std"] }
legix-error = { version = "^0.4.0", path = "../legix-error" }
