lints.workspace = true

[package]
name = "legix-ignore"
version = "0.23.0"
repository = "https://github.com/aicumene/legix"
license = "MIT OR Apache-2.0"
description = "A crate of legix, a fork of the gitoxide project dealing .gitignore files"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
include = ["/src/**/*", "/LICENSE-*"]
rust-version = "1.88"

[lib]
doctest = true

[features]
## Data structures implement `serde::Serialize` and `serde::Deserialize`.
serde = ["dep:serde", "bstr/serde", "legix-glob/serde"]

[dependencies]
legix-glob = { version = "^0.28.0", path = "../legix-glob" }
legix-path = { version = "^0.13.0", path = "../legix-path" }
legix-trace = { version = "^0.2.0", path = "../legix-trace" }

bstr = { version = "1.12.0", default-features = false, features = ["std", "unicode"] }
unicode-bom = { version = "2.0.3" }
serde = { version = "1.0.114", optional = true, default-features = false, features = ["derive"] }

document-features = { version = "0.2.1", optional = true }

[dev-dependencies]
legix-testtools = { path = "../tests/tools" }
legix-fs = { path = "../legix-fs" }

[package.metadata.docs.rs]
all-features = true
features = ["document-features"]

[package.metadata.cargo-machete]
ignored = [
    # Public optional `serde` feature is retained for downstream feature compatibility.
    "serde",
]
