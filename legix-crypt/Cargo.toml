lints.workspace = true

[package]
name = "legix-crypt"
version = "0.1.0"
description = "Encrypted documents for git: content-addressed, a key per document, erased by destroying the key"
repository = "https://github.com/aicumene/legix"
license = "MIT OR Apache-2.0"
authors = ["Ivan Menshikov <menshivan@gmail.com>"]
edition = "2024"
rust-version = "1.88"
keywords = ["git", "encryption", "erasure", "content-addressed", "legix"]
categories = ["cryptography", "development-tools"]
include = ["src/**/*", "README.md", "FORMAT.md", "LICENSE-*"]

[dependencies]
blake3 = "1.8.7"
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["zeroize"] }
getrandom = { version = "0.3.4", features = ["std"] }
hkdf = "0.13.0"
sha2 = { version = "0.11.0", default-features = false }
subtle = { version = "2.6.1", default-features = false }
tempfile = "3.26.0"
thiserror = "2.0.18"
zeroize = { version = "1.9.0", features = ["zeroize_derive"] }
