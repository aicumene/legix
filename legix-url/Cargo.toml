lints.workspace = true

[package]
name = "legix-url"
version = "0.39.0"
repository = "https://github.com/aicumene/legix"
license = "MIT OR Apache-2.0"
description = "A crate of legix, a fork of the gitoxide project implementing parsing and serialization of legix-url"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
include = ["/src/**/*", "/LICENSE-*", "/tests/baseline/**/*"]
rust-version = "1.88"

[lib]
doctest = true

[features]
## Data structures implement `serde::Serialize` and `serde::Deserialize`.
serde = ["dep:serde", "bstr/serde"]

[dependencies]
legix-path = { version = "^0.13.0", path = "../legix-path" }
legix-utils = { version = "^0.4.0", path = "../legix-utils", features = ["bstr"] }
legix-error = { version = "^0.4.0", path = "../legix-error" }

serde = { version = "1.0.114", optional = true, default-features = false, features = ["std", "derive"] }
bstr = { version = "1.12.0", default-features = false, features = ["std"] }
percent-encoding = "2.3.1"

document-features = { version = "0.2.0", optional = true }

[dev-dependencies]
insta = "1.46.3"
assert_matches = "1.5.0"
legix-testtools = { path = "../tests/tools", features = ["sha1"] }
serde_json = "1.0.150"

[package.metadata.docs.rs]
all-features = true
features = ["document-features"]
