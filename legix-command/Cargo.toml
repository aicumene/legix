lints.workspace = true

[package]
name = "legix-command"
version = "0.11.0"
repository = "https://github.com/aicumene/legix"
license = "MIT OR Apache-2.0"
description = "A crate of legix, a fork of the gitoxide project handling internal git command execution"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
rust-version = "1.88"
include = ["/src/*.rs", "/LICENSE-*"]

[lib]
doctest = true

[dependencies]
legix-error = { version = "^0.4.0", path = "../legix-error" }
legix-trace = { version = "^0.2.0", path = "../legix-trace" }
legix-path = { version = "^0.13.0", path = "../legix-path" }
legix-quote = { version = "^0.9.0", path = "../legix-quote" }

bstr = { version = "1.12.0", default-features = false, features = ["std", "unicode"] }

[dev-dependencies]
insta = "1.46.3"
legix-testtools = { path = "../tests/tools", features = ["sha1"] }
