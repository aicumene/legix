lints.workspace = true

[package]
name = "legix-status"
version = "0.35.0"
repository = "https://github.com/aicumene/legix"
license = "MIT OR Apache-2.0"
description = "A crate of legix, a fork of the gitoxide project dealing with 'git status'-like functionality"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>", "Pascal Kuthe <pascal.kuthe@semimod.de>"]
edition = "2024"
include = ["/src/**/*", "/LICENSE-*"]
rust-version = "1.88"

[lib]
doctest = false

[features]
## Enable support for the SHA-1 hash by enabling the respective feature in the `legix-hash` crate.
sha1 = ["legix-hash/sha1"]
## Enable support for the SHA-256 hash by enabling the respective feature in the `legix-hash` crate.
sha256 = ["legix-hash/sha256"]
## Add support for tracking rewrites along with checking for worktree modifications.
worktree-rewrites = ["dep:legix-dir", "dep:legix-diff"]
## Enable parallel algorithms.
parallel = ["legix-features/parallel"]

[dependencies]
legix-index = { version = "^0.56.0", path = "../legix-index" }
legix-fs = { version = "^0.23.0", path = "../legix-fs" }
legix-hash = { version = "^0.27.0", path = "../legix-hash" }
legix-error = { version = "^0.4.0", path = "../legix-error" }
legix-object = { version = "^0.65.0", path = "../legix-object" }
legix-path = { version = "^0.13.0", path = "../legix-path" }
legix-features = { version = "^0.50.0", path = "../legix-features", features = ["progress"] }
legix-filter = { version = "^0.35.0", path = "../legix-filter" }
legix-worktree = { version = "^0.57.0", path = "../legix-worktree", default-features = false, features = ["attributes"] }
legix-pathspec = { version = "^0.21.0", path = "../legix-pathspec" }

legix-dir = { version = "^0.30.0", path = "../legix-dir", optional = true }
legix-diff = { version = "^0.68.0", path = "../legix-diff", default-features = false, features = ["blob"], optional = true }

filetime = "0.2.29"
bstr = { version = "1.12.0", default-features = false }

document-features = { version = "0.2.0", optional = true }

[target.'cfg(not(target_has_atomic = "64"))'.dependencies]
portable-atomic = "1"

[target.'cfg(windows)'.dependencies]
hashbrown = "0.16.0"
windows-sys = { version = "0.61.1", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    # Needed for `SECURITY_ATTRIBUTES` in the signature of `CreateFileW`,
    # which is gated behind this windows-sys feature even when the call passes null.
    "Win32_Security",
] }

[dev-dependencies]
insta = "1.46.3"
legix-status = { path = ".", features = ["worktree-rewrites", "parallel", "sha1", "sha256"] }
legix-testtools = { path = "../tests/tools", default-features = false, features = ["sha1", "sha256"] }
legix-index = { path = "../legix-index" }
legix-fs = { path = "../legix-fs" }
legix-diff = { path = "../legix-diff" }
legix-filter = { path = "../legix-filter" }
legix-dir = { path = "../legix-dir" }
legix-odb = { path = "../legix-odb" }
legix-object = { path = "../legix-object" }
legix-pathspec = { path = "../legix-pathspec" }
legix-worktree = { path = "../legix-worktree" }
pretty_assertions = "1.4.0"

[package.metadata.docs.rs]
features = ["sha1", "document-features", "worktree-rewrites"]
